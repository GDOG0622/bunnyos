<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="bunnyos-shell-version" content="20261003.3">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BunnyOS</title>
    <link rel="icon" href="/app-icon">
    <link rel="apple-touch-icon" href="/app-icon">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BunnyOS">
    <script>
        // 核心数据与样式、脚本同时下载；只在本次启动的内存中交接一次。
        (() => {
            const requests = new Map();
            window.bunnyosTakeStartupRequest = url => {
                const pending = requests.get(url);
                requests.delete(url);
                return pending;
            };
            for (const url of ['/api/settings', '/api/apps', '/api/qq/characters', '/api/qq/chats?summary=1']) {
                const pending = fetch(url, { cache: 'no-store' }).then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                });
                // 消费者稍后接管错误并显示重试，避免先完成的失败请求产生未处理 rejection。
                pending.catch(() => {});
                requests.set(url, pending);
            }
        })();
    </script>
    <script>
        // 调试：URL 带 ?debug=1 时加载 Eruda 移动端 devtools
        if (location.search.includes('debug=1')) {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/eruda@3.0.1/eruda.js';
            s.onload = () => window.eruda && window.eruda.init();
            document.head.appendChild(s);
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 启动遮罩的关键布局随 HTML 一起更新，避免旧 CSS 缓存使它进入桌面文档流。 -->
    <style id="boot-critical-style">
        #boot-screen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            box-sizing: border-box;
            z-index: 99999;
            display: grid;
            place-items: center;
            overflow: hidden;
            background-color: #edf8f2;
        }
        html.bunny-dark-mode #boot-screen { background-color: #172a2b; }
        #boot-screen.is-ready { visibility: hidden; pointer-events: none; }
    </style>
    <link rel="stylesheet" href="assets/styles/base.css?v=20261003.2">
    <link rel="stylesheet" href="assets/styles/desktop.css?v=20261003.2">
    <link rel="stylesheet" href="assets/styles/window.css?v=20261003.2">
    <link rel="stylesheet" href="assets/styles/announcement.css?v=20260923.1">
</head>
<body>

    <div class="boot-screen" id="boot-screen" role="status" aria-live="polite">
        <div class="boot-card">
            <div class="boot-mark" aria-hidden="true"><span></span><span></span></div>
            <h1>BunnyOS</h1>
            <p id="boot-message">正在准备桌面…</p>
            <div class="boot-progress" aria-hidden="true"><span></span></div>
            <div class="boot-actions" id="boot-actions" hidden>
                <button type="button" id="boot-retry">重新加载</button>
                <button type="button" id="boot-enter">先进入桌面</button>
            </div>
        </div>
    </div>

    <div class="top-bar mobile-status">
        <span id="mobile-time">10:00</span>
        <div class="right">
            <i class="bi bi-reception-4"></i>
            <i class="bi bi-wifi"></i>
            <i class="bi bi-battery-full"></i>
        </div>
    </div>

    <div class="top-bar mac-menu">
        <div class="left">
            <span><i class="bi bi-apple"></i></span>
            <span style="font-weight: bold;">BunnyOS</span>
            <span>文件</span><span>编辑</span><span>视图</span><span>窗口</span>
        </div>
        <div class="right">
            <i class="bi bi-wifi"></i>
            <i class="bi bi-battery-full"></i>
            <span id="mac-time">周一 10:00</span>
        </div>
    </div>

    <div class="mobile-desktop" id="mobile-desktop"></div>

    <div class="app-window" id="app-window">
        <div class="window-header">
            <div class="mac-controls" aria-label="窗口控制">
                <button type="button" class="mac-btn mac-close" onclick="closeApp()" aria-label="关闭窗口"></button>
                <button type="button" class="mac-btn mac-min" onclick="minimizeApp()" aria-label="最小化窗口"></button>
                <button type="button" class="mac-btn mac-max" onclick="toggleFullscreen()" aria-label="切换全屏"></button>
            </div>
            <button type="button" class="mobile-back" onclick="handleMobileBack()">
                <i class="bi bi-chevron-left"></i><span>返回</span>
            </button>
            <div class="window-title" id="window-title">Loading...</div>
        </div>
        
        <div class="window-content" id="window-content">
            <div class="placeholder-ui" id="placeholder-ui">
                <i id="app-content-icon" class="bi" style="font-size: 64px; margin-bottom: 20px;"></i>
                <h2 style="color: #333; margin-bottom: 12px; font-weight: 500;">
                    正在运行 <span id="app-name-display" style="color: #007AFF;">应用</span>
                </h2>
                <p style="color: #666; font-size: 14px; line-height: 1.6; max-width: 400px; padding: 0 20px;">
                    这里是预留的「无界面」交互区域。<br>
                    它已经适配好了宽屏和窄屏的响应式环境，你可以将大模型对话气泡流直接丢到这个区块里。
                </p>
            </div>
            <div id="iframe-pool" style="width: 100%; height: 100%; position: relative; display: none;"></div>
        </div>
        <div class="resize-handle resize-n" data-resize="n"></div>
        <div class="resize-handle resize-s" data-resize="s"></div>
        <div class="resize-handle resize-e" data-resize="e"></div>
        <div class="resize-handle resize-w" data-resize="w"></div>
        <div class="resize-handle resize-ne" data-resize="ne"></div>
        <div class="resize-handle resize-nw" data-resize="nw"></div>
        <div class="resize-handle resize-se" data-resize="se"></div>
        <div class="resize-handle resize-sw" data-resize="sw"></div>
        <div class="control-hotzone" id="control-hotzone"></div>
    </div>
    <div class="bunnyos-announcement hidden" id="bunnyos-announcement" role="dialog" aria-modal="true" aria-labelledby="bunnyos-announcement-title">
        <div class="bunnyos-announcement-card">
            <span class="bunnyos-announcement-doodle top" aria-hidden="true">⌁ ✦ ୨୧</span>
            <span class="bunnyos-announcement-doodle bottom" aria-hidden="true">☆ bunny memo ──</span>
            <div class="bunnyos-announcement-heading">
                <div class="bunnyos-announcement-heading-main">
                    <span class="bunnyos-announcement-kicker">!!! BUNNY BULLETIN</span>
                    <h2 id="bunnyos-announcement-title">BunnyOS 公告</h2>
                </div>
                <button type="button" class="bunnyos-announcement-close" data-announcement-close aria-label="关闭"><i class="bi bi-x-lg"></i></button>
            </div>
            <ul class="bunnyos-announcement-list" id="bunnyos-announcement-list"></ul>
            <p class="bunnyos-announcement-reminder">今日便签：记得给 BunnyOS 留一份云端备份。</p>
            <div class="bunnyos-announcement-actions">
                <button type="button" class="bunnyos-announcement-action primary" id="bunnyos-announcement-backup">去备份</button>
                <button type="button" class="bunnyos-announcement-action secondary" data-announcement-close>晚点再说</button>
                <button type="button" class="bunnyos-announcement-action secondary" id="bunnyos-announcement-snooze">关闭提醒，直到下次更新</button>
            </div>
        </div>
    </div>
    <!-- 后台通知横幅 + 提示音 -->
    <div class="bunnyos-banner hidden" id="bunnyos-banner" role="alert">
        <div class="bunnyos-banner-avatar"><img id="bunnyos-banner-avatar-img" alt=""></div>
        <div class="bunnyos-banner-main">
            <div class="bunnyos-banner-title" id="bunnyos-banner-title"></div>
            <div class="bunnyos-banner-text" id="bunnyos-banner-text"></div>
        </div>
        <button type="button" class="bunnyos-banner-close" id="bunnyos-banner-close" aria-label="关闭"><i class="bi bi-x-lg"></i></button>
    </div>
    <audio id="bunnyos-notify-audio" preload="auto" playsinline webkit-playsinline></audio>

    <script src="assets/scripts/catbox-proxy.js"></script>
    <script src="assets/scripts/theme.js?v=20261003.3"></script>
    <script src="assets/scripts/apps.js?v=20261003.3"></script>
    <script src="assets/scripts/window-manager.js?v=20261003.2"></script>
    <script src="assets/scripts/notify.js"></script>
    <script src="assets/scripts/announcement.js"></script>
    <script src="assets/scripts/clock.js?v=20261003.3"></script>
</body>
</html>
